# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The dependency submission API writes the snapshot back to the repository,
    # which the default read-only workflow token is not allowed to do.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6.0.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # The context test boots the real application, so every tenant database from
    # db.configurations must be reachable. Reuse the project's compose file so CI
    # and local development share one definition.
    - name: Start tenant databases
      run: docker compose up -d

    - name: Wait for tenant databases
      run: |
        for container in mysql mysql2; do
          for i in $(seq 1 60); do
            if docker exec "$container" mysqladmin ping -h127.0.0.1 -uroot -p53cret --silent 2>/dev/null; then
              echo "$container is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "$container did not become ready in time"
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
        done

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Stop tenant databases
      if: always()
      run: docker compose down -v

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
